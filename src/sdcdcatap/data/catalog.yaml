# Declared input: what the catalog's publisher states, because the profile's controlled vocabularies and ranges demand
# values the model's package cannot know. Override by editing a copy of this file (--catalog FILE) or with
# --contact-name and --contact-email. The writer refuses an empty contact e-mail rather than inventing one.
contact:
  name: Axius SDC, Inc. DCAT-AP contact
  email: contact@axius-sdc.com
catalog:
  id: https://semanticdatacharter.com/catalogs/governed-data-records
  title: Semantic Data Charter governed data records
  description: Collections of Governed Data Records, one per published Semantic Data Charter model, each described by the immutable schema its records conform to.
  homepage: https://semanticdatacharter.com
publisher:
  name: Axius SDC, Inc.
  id: https://axius-sdc.com
  type: http://purl.org/adms/publishertype/Company      # ADMS publisher type vocabulary
  type_label: Company
